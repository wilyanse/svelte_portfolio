<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="author" content="Will Bryan Jose" />
		<meta
			name="description"
			content="Will Bryan Jose — a big data fan aspiring to become a Data Scientist. Portfolio, projects, and background."
		/>

		<!-- Set the theme before first paint so there's no flash of the wrong theme. -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t !== 'light' && t !== 'dark') {
						t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
					}
					document.documentElement.dataset.theme = t;
				} catch (e) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>

		<!-- Open Graph / Twitter (replace og:image with a 1200x630 card, and set og:url to the live domain). -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Will's Portfolio" />
		<meta
			property="og:description"
			content="Will Bryan Jose — a big data fan aspiring to become a Data Scientist. Projects, experience, and background."
		/>
		<meta property="og:image" content="%sveltekit.assets%/favicon.png" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Will's Portfolio" />
		<meta
			name="twitter:description"
			content="Will Bryan Jose — a big data fan aspiring to become a Data Scientist. Projects, experience, and background."
		/>
		<meta name="twitter:image" content="%sveltekit.assets%/favicon.png" />
		<meta name="theme-color" content="#191919" />

		<title>Will's Portfolio</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
